# ============================================
# fast_admin Nginx 配置文件
# ============================================

# 自动检测 CPU 核心数，多核服务器自动利用所有核心
worker_processes auto;

# 错误日志输出到 stdout（Docker 容器日志最佳实践）
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    accept_mutex on; # 设置网络连接序列化，防止惊群现象发生，默认为on
    multi_accept on; # 设置一个进程是否同时接受多个网络连接，默认为off
    use epoll; # 事件驱动模型，select|poll|kqueue|epoll|resig|/dev/poll|eventport
    worker_connections 1024; # 最大连接数，默认为512
}

http {
    include /etc/nginx/fast-admin/common.conf;

    # ==================== HTTP -> HTTPS 重定向（含 ACME） ====================
    # HTTP server块 - Let's Encrypt ACME 挑战 + 重定向到 HTTPS
    server {
        listen 80;
        server_name service.xxcdjl.xyz;

        # Let's Encrypt ACME 挑战（webroot 模式）
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 其余请求重定向到 HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ==================== HTTPS Server ====================
    server {
        listen 443 ssl;
        http2 on;
        server_name service.xxcdjl.xyz;

        # ==================== SSL 配置（Let's Encrypt） ====================
        ssl_certificate     /etc/letsencrypt/live/service.xxcdjl.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/service.xxcdjl.xyz/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/service.xxcdjl.xyz/chain.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;


        include /etc/nginx/fast-admin/locations.conf;
    }
}
